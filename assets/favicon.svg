<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Rose window">
  <title>Rose window</title>

  <!-- Night ground, full bleed so the tile reads on light and dark browser chrome -->
  <rect width="64" height="64" fill="#131B1D"/>

  <!-- Eight petals / attention heads, alternating. Two paths only: no strokes,
       no leading lines - at 16px the colour change is the only separator that survives. -->
  <path fill="#2E7B80" d="M32 32 L62 32 A30 30 0 0 1 53.21 53.21 Z
                          M32 32 L32 62 A30 30 0 0 1 10.79 53.21 Z
                          M32 32 L2 32  A30 30 0 0 1 10.79 10.79 Z
                          M32 32 L32 2  A30 30 0 0 1 53.21 10.79 Z"/>
  <path fill="#6B4272" d="M32 32 L53.21 53.21 A30 30 0 0 1 32 62 Z
                          M32 32 L10.79 53.21 A30 30 0 0 1 2 32 Z
                          M32 32 L10.79 10.79 A30 30 0 0 1 32 2 Z
                          M32 32 L53.21 10.79 A30 30 0 0 1 62 32 Z"/>

  <!-- Amber oculus -->
  <circle cx="32" cy="32" r="11" fill="#C08B33"/>
</svg>
